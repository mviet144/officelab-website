<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Favicon 256x256</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 256px;
      height: 256px;
      overflow: hidden;
      background: transparent;
    }
    img {
      display: block;
      width: 256px;
      height: 256px;
      border: 0;
    }
  </style>
</head>
<body>
  <img src="../../site/favicon.svg" width="256" height="256" alt="Office Lab Favicon">
</body>
</html>
